name: Run Character Pipeline Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml trimesh numpy requests pygltflib

      - name: Download Sketchfab Model
        env:
          SKETCHFAB_API_TOKEN: ${{ secrets.SKETCHFAB_API_TOKEN }}
        run: |
          python -c "
          import os, requests, zipfile
          token = os.environ['SKETCHFAB_API_TOKEN']
          uid = 'afa901030a054533bcd7bcd3fa974f4d'
          headers = {'Authorization': f'Token {token}'}
          resp = requests.get(f'https://api.sketchfab.com/v3/models/{uid}/download', headers=headers)
          resp.raise_for_status()
          dl_url = resp.json()['gltf']['url']
          r = requests.get(dl_url)
          with open('model.zip', 'wb') as f:
              f.write(r.content)
          with zipfile.ZipFile('model.zip', 'r') as z:
              z.extractall('input/')
          os.remove('model.zip')
          "

      - name: Run test_game.py
        run: python test_game.py

      - name: Upload GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitted-character-glb
          path: output/fitted_character.glb
