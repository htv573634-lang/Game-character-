name: Run Character Pipeline Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml trimesh numpy

      - name: Run test_game.py
        run: python test_game.py

      - name: Upload GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitted-character-glb
          path: output/fitted_character.glb
